<!doctype html>
<html>
  <body style="margin:0;padding:24px;background:#f5f6fa;font-family:Arial,sans-serif;color:#1f2933;">
    <div style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:8px;padding:28px;box-shadow:0 10px 25px rgba(0,0,0,0.08);">
      <h1 style="margin:0 0 12px;font-size:22px;color:#111827;">Reset your password</h1>
      <p style="margin:0 0 16px;line-height:1.5;">Hi {{ user.username }},</p>
      <p style="margin:0 0 22px;line-height:1.5;">
        We received a request to reset your Todo Management password.
      </p>
      <p style="margin:0 0 24px;">
        <a href="{{ reset_url }}" style="display:inline-block;padding:11px 16px;background:#2c3e50;color:#ffffff;text-decoration:none;border-radius:6px;font-weight:600;">
          Reset Password
        </a>
      </p>
      <p style="margin:0 0 10px;line-height:1.5;font-size:13px;color:#4b5563;">
        If the button does not work, open this link:
      </p>
      <p style="margin:0 0 20px;line-height:1.5;font-size:13px;word-break:break-all;">
        <a href="{{ reset_url }}" style="color:#2c3e50;">{{ reset_url }}</a>
      </p>
      <p style="margin:0;line-height:1.5;font-size:13px;color:#4b5563;">
        If you did not request this, you can ignore this email.
      </p>
    </div>
  </body>
</html>
